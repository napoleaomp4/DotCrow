[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/napoleaomp4/dotcrow"
homepage = "https://dotcrow.si"
authors = ["Napoleão de Sousa Carvalho Junior (@napoleaomp4)", "Contribuidores do DotCrow"]

[workspace.dependencies]
ml-kem = "0.3"
x25519-dalek = { version = "3", features = ["static_secrets"] }
chacha20poly1305 = "0.11"
hkdf = "0.13"
sha2 = "0.11"
getrandom = "0.4"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "sync", "io-util", "signal", "process", "fs"] }
clap = { version = "4.5", features = ["derive"] }
rpassword = "7"
directories = "6"
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-root-certs = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustyline = { version = "16", default-features = false, features = ["with-file-history"] }

dotcrow-core = { path = "crates/dotcrow-core", version = "0.8.0" }
dotcrow-relay = { path = "crates/dotcrow-relay", version = "0.8.0" }
dotcrow-crypto = { path = "crates/dotcrow-crypto", version = "0.8.0" }
dotcrow-vault = { path = "crates/dotcrow-vault", version = "0.8.0" }
dotcrow-tunel = { path = "crates/dotcrow-tunel", version = "0.8.0" }
dotcrow-providers = { path = "crates/dotcrow-providers", version = "0.8.0" }
dotcrow-agents = { path = "crates/dotcrow-agents", version = "0.8.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
